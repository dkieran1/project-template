permissions:
  scopes:
    - read:jira-work
    - write:jira-work
modules:
  trigger:
    - key: comment-issue-app-hello-world
      function: main
      events:
        - avi:jira:created:issue
      filter:
        ignoreSelf: false
        expression: event.issue.fields.summary != null
  function:
    - key: main
      handler: index.run
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/defe6d1a-4659-45c9-af0f-2c1f6d0da7cf
